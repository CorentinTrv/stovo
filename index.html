<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=app/">
<link rel="canonical" href="https://corentintrv.github.io/stovo/app/">
<title>Stovo</title>
<style>
  :root{--brand-dark:#0f766e;--brand-darker:#115e59;--bg:#f1f5f9;--text:#0f172a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  main{max-width:360px;}
  h1{font-size:22px;margin-bottom:10px;}
  p{font-size:15px;margin-bottom:20px;}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 24px;background:var(--brand-dark);color:#fff;text-decoration:none;font-weight:700;font-size:15px;border-radius:10px;}
  a.btn:hover{background:var(--brand-darker);}
  a.btn:focus-visible{outline:3px solid var(--text);outline-offset:2px;}
</style>
<script>
  location.replace('app/' + location.search + location.hash);
</script>
</head>
<body>
<main>
  <h1>Stovo</h1>
  <p>Cette page a été remplacée. Redirection vers l'application en cours.</p>
  <a class="btn" href="app/">Ouvrir Stovo</a>
</main>
</body>
</html>
